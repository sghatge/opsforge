name: OPSFORGE tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -t .
      - name: Run OPSFORGE all-in-one policy and QA tests
        run: python OPSFORGE_ALL_IN_1.py --test
      - name: Compile four-mission integration smoke test
        run: python -m py_compile scripts/opsforge_integration_smoke.py
